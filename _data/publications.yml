# Publications — hand-maintained (replaces jekyll-scholar / BibTeX).
# Highlight the author's own name with <b>…</b>.
#   type      : full paper | workshop | poster | abstract | preprint | thesis | chapter
#   selected  : surfaces the paper on the home page (no visible "selected" tag)
#   status    : optional italic note after the venue (e.g. "To appear").
#               "Under review" is special: it renders as a badge instead of an
#               italic note, and files the paper under the Preprint filter.
#   tags      : extra badges, hand-set per entry (e.g. tags: ["Best Paper"])
#   doi / url : links; doi also renders a DOI chip
#   bibtex    : shown in a collapsible, copyable block on the publications page
# The order of this file IS the order on the page — nothing sorts it. Keep
# entries grouped by year (newest first) so each year heading appears once.

