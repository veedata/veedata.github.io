# -----------------------------------------------------------------------------
# veedata.github.io — minimal theme (redesign v1)
# -----------------------------------------------------------------------------

title: Viraj Thakkar
email: viraj.online@asu.edu
subtitle: Computer Science Ph.D. Student at Arizona State University.
description: >
  Viraj Thakkar — CS Ph.D. student at Arizona State University working on
  LSM-based key-value stores, disaggregated infrastructure, and storage for AI/ML.
keywords: viraj thakkar, asu, hpe, lsm-kvs, storage systems, rocksdb, phd
lang: en
icon: 📄

# Shown as a compact label row in the home-page hero, ABOVE the bio.
research_areas:
  - Key-Value Stores
  - Filesystems & Caching
  - Disaggregated Infrastructure
  - Storage for AI/ML

url: https://veedata.github.io
baseurl: ""

# -----------------------------------------------------------------------------
# Navigation (order + labels controlled here; no hamburger on desktop)
# -----------------------------------------------------------------------------

# Primary items shown in the desktop bar AND the mobile floating island.
nav_primary:
  - { name: About, url: /, icon: user }
  - { name: Publications, url: /publications/, icon: doc }
  - { name: CV, url: /cv/, icon: file }
  - { name: Projects, url: /projects/, icon: grid }

# How many nav_primary items the mobile island shows before the rest spill into
# the ⋮ menu. Reorder nav_primary to change WHICH ones make the cut.
island_max: 3

# Overflow items: shown inline on desktop, tucked into the island's ⋮ popover on
# mobile (together with anything nav_primary spills past island_max).
nav_more: []

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /projects/:name/
# (news is hand-maintained in _data/news.yml)

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

sass:
  style: compressed

permalink: /blog/:year/:title/   # only relevant if the (parked) blog is re-enabled

include: ["_pages"]
# Everything here exists in the repo; dotfiles (.git, .dockerignore …)
# are excluded by Jekyll automatically and don't need listing.
exclude:
  - README.md
  - REDESIGN_PLAN.md
  - LICENSE
  - Gemfile
  - vendor/

plugins:
  - jekyll-feed
  - jekyll-sitemap

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

# Cronitor RUM. This is the public client key that ships in the page HTML — it
# is not a secret. Only injected when JEKYLL_ENV=production, so local `run.sh`
# sessions don't pollute the stats.
cronitor_analytics: f1b76fc182b3dedcd9d8ac7635ed8a2e
