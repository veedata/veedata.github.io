<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link href="https://netdna.bootstrapcdn.com/font-awesome/4.1.0/css/font-awesome.css" rel="stylesheet">

  <title>Viraj Thakkar</title>

  <style>
    #changeText {
      opacity: 1;
      transition: opacity 0.7s;
    }

    body, html {
      height: 100%;
      min-height: 100%;

      background:linear-gradient(0deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url(static/images/alex-shutin-kKvQJ6rK6S4-unsplash.jpg);
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-y: hidden;
    }

    footer {
      margin-top:auto;
      color: white;
      text-align: right;
    }

    main {
      /* min-height 100vh causes issues with scrolling.
      Make sure you look into it later! */

      color: azure;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body class="d-flex flex-column h-100">

  <br>
  <main>
    <div style="align-items: center; text-align: center;">
      <div class="container">
        <h1 id="changeText"style="font-size: 70px;">hello</h1>
        <h4 class="motto" style="font-size: 25px;">Website Coming Soon :)</h4>
      </div>
    </div>
  </main>

  <footer>
      <div class="container footer fixed-bottom mb-4">
      Being made with <i class="fa fa-heart heart"></i> by <a href="https://github.com/veedata" style="color:rgb(255, 236, 61)">Viraj Thakkar</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>

  <script>
    var counter = 0;
    var elem = document.getElementById("changeText");

    var text = ["bonjour", "你好", "hola", "नमस्ते", "hej", "مرحبا", "tonk'peh", "hello"];
    var inst = setInterval(change, 4000);

    function change() {
      elem.style.opacity = 0
      setTimeout(function() {
        elem.style.opacity = 1
        elem.innerHTML = text[counter];
        counter = (counter + 1) % text.length;
      }, 1000
      );
    }
  </script>
</body>

</html>
