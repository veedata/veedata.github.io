    <script>
        var text = ["hello", "hej", "hola", "bonjour", "你好"];
        var counter = 0;
        var elem = document.getElementById("changeText");
        var inst = setInterval(change, 5000);

        function change() {
            elem.innerHTML = text[counter];
            counter++;
            if (counter >= text.length) {
                counter = 0;
            }
        }
    </script>
